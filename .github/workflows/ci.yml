name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A failed run whose cause was environmental — a flaky download, a runner
  # hiccup — should be retryable without manufacturing an empty commit.
  workflow_dispatch:

# A run superseded by a newer push to the same ref is checking a commit nobody
# will merge — cancel it and give the runner to the one somebody will.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Production bundling is its own way to fail — electron-vite resolves,
      # tree-shakes and externalizes differently from the dev server, and an
      # Electron app whose bundling only runs at release time ships bundling
      # regressions blind. This is the same `pnpm run build` the release
      # workflow performs before packaging, exercised on every change.
      - run: pnpm build

  # Windows is a product platform, not just a release target: the suite covers
  # behavior that only exists there — `.cmd` shim spawning, junction links in
  # the profile farm, drive-letter path semantics — and a regression in any of
  # it is invisible on Ubuntu. A separate job rather than a matrix so the
  # `checks` status name existing branch protection knows stays put.
  checks-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The Linux sandbox, driven rather than asserted.
  #
  # `commandSandbox.ts` builds an argv, and no unit test can say whether that
  # argv confines anything — that is a question only a kernel answers. The
  # bubblewrap backend spent its life marked `unverified` for exactly this
  # reason, and when it was finally driven it turned out to mount an empty
  # tmpfs over its own workspace, so no command ran at all. A unit test on the
  # argv would not have caught it; a unit test on the argv *passed* while it
  # was broken.
  #
  # So this job runs `scripts/sandbox-check.ts`, which writes inside the
  # workspace, tries to write outside it, and tries to reach a listener it
  # starts itself — failing the job on any of those going the wrong way. It is
  # what keeps the `verified` label on that backend earned instead of aging
  # back into a claim.
  #
  # A separate job rather than a step in `checks`, for the reason the Windows
  # suite is one: the `checks` status name is what branch protection knows, and
  # a runner image that stops permitting unprivileged user namespaces should be
  # visible without blocking every merge behind it.
  sandbox-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - run: pnpm sandbox:check
