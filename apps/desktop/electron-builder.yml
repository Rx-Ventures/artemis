# The NSIS installer stamps this onto the Start Menu shortcut as its AUMID.
# `APP_USER_MODEL_ID` in main/index.ts must match it exactly, or Windows treats
# the running window and the installed shortcut as two different applications.
appId: dev.artemis.app
productName: Artemis
copyright: Artemis contributors

directories:
  output: release
  buildResources: build

# `out/` is the electron-vite build output. Runtime dependencies that must not
# be bundled (the Claude Agent SDK spawns processes and reads from disk) are
# shipped as real node_modules alongside it.
files:
  - out/**/*
  - package.json

# Neither of these can be read out of the archive. The Agent SDK spawns its own
# binaries; node-pty has to `dlopen` a `.node` binding and, on macOS and Linux,
# `exec` the `spawn-helper` beside it — and there is no path into an asar that
# either call can use.
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk/**'
  - '**/node_modules/node-pty/**'

# The cerebro CLI Artemis ships for bootstrap: creating or joining a memory
# bank on a machine that has none yet (a bank's own embedded copy wins once one
# exists — see main/memoryBanks.ts). Outside the asar because it is spawned.
# Refresh from the cerebro repo's bin/cerebro when the contract changes.
extraResources:
  - from: resources/cerebro
    to: cerebro

# Unpacking preserves the mode the file had in the archive, and node-pty
# publishes `spawn-helper` as 0644 — so without this every install arrives
# unable to exec the helper, and every terminal fails with `posix_spawnp
# failed`. The hook sets the bit while the bundle is still writable, which is
# the only time it can be set for an install the user does not own. See
# `build/after-pack.cjs`.
afterPack: ./build/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  # The arch is part of every name, x64 included — electron-builder's default
  # omits it for x64, which makes "which file is this?" a trick question the
  # moment two architectures share a release page.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip

win:
  target:
    - nsis

nsis:
  # The name the in-app updater downloads. `latest.yml` carries it as the feed's
  # top-level `path`, and `main/updateFeed.ts` refuses a feed whose path is not
  # an `.exe` — so this pattern and that check move together. The arch is in the
  # name for the same reason it is in the mac one: two builds on one release
  # page must not be a guessing game.
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

linux:
  category: Development
  # A scoped npm package name otherwise becomes `@rx-artemisdesktop` on
  # Linux. Keep the installed command and the unpacked binary predictable.
  executableName: artemis
  artifactName: ${productName}-${version}-${arch}.${ext}
  synopsis: A desktop UI for agentic coding CLIs
  description: >-
    Artemis drives Claude Code, Codex and other agentic coding CLIs from one
    window: sessions per project, a terminal, a file tree and a browser beside
    the transcript, and one set of accounts shared across them.
  # The window's identity to the desktop, and the reason it is spelled here and
  # in `desktopName` in package.json rather than left to default.
  #
  # GNOME and KDE match a running window to its launcher by app id — WM_CLASS on
  # X11, the xdg-shell app_id on Wayland — and Electron takes that id from
  # `desktopName` in package.json. electron-builder takes `StartupWMClass` from
  # the same field. Left unset, Electron uses the app name and the builder uses
  # `productName`, which agree today only by luck: both happen to be "Artemis",
  # and a flavoured build (`productName: Artemis (Beta)`, `app.setName` giving
  # `Artemis Beta`) is one rename away from a window that shows as a generic
  # cog beside the launcher it came from. `syncDesktopName` is what makes the
  # installed `.desktop` file agree with both.
  #
  # The name itself lives in `desktopName` in package.json and *only* there:
  # it is not an electron-builder option, and electron-builder validates this
  # file against its schema, so spelling it here fails the build rather than
  # being ignored. Both tools read the package.json field.
  syncDesktopName: true
  desktop:
    entry:
      Keywords: agent;ai;claude;codex;coding;llm;terminal;
  target:
    - AppImage
    - deb
    - pacman

# What an Arch package must ask for, spelled out because the default is wrong.
# ============================================================================
#
# electron-builder's built-in pacman dependency list is inherited from a much
# older Electron and names two packages that Arch's official repositories do
# not carry: `libappindicator-gtk3`, dropped to the AUR, and `http-parser`,
# dropped outright. `pacman -U` resolves dependencies against the configured
# repositories and refuses the install when one cannot be found — so the
# artifact this workflow has been publishing could not be installed on a stock
# Arch or CachyOS machine at all. Verified against archlinux.org's package API
# on 2026-08-31: both return no result in core, extra or multilib.
#
# The rest of that default list is `c-ares`, `ffmpeg`, `libevent`, `libvpx`,
# `libxslt`, `minizip`, `re2` and `snappy` — libraries a *system-linked*
# Electron needs, of the kind Arch's own `electron` package unbundles against.
# electron-builder ships a self-contained Electron that carries its own copies,
# so those are not this package's dependencies; they are a longer install for
# no behaviour.
#
# What is left is what Chromium actually dlopens plus the two libraries Artemis
# specifically needs: `libsecret` because `main/profileSecrets.ts` stores the
# local server key through it, and `libnotify` because the routines host posts
# desktop notifications. `xdg-utils` is what `shell.openExternal` shells out
# to. All seven are in core or extra today.
pacman:
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libnotify
    - libsecret
    - xdg-utils

# Declaring the provider makes electron-builder emit an update feed beside the
# artifacts — latest-mac.yml from a mac build, latest.yml from a Windows one,
# each naming the artifact that build's updater installs. Actual publishing is
# done by scripts/release.ts via `gh` after every gate has passed — the dist
# build always runs with `--publish never`.
publish:
  provider: github
  # The repository moved from the Rx-Ventures org to seth-torrence on
  # 2026-08-30. GitHub redirects the old path, which is why builds kept
  # working — but a redirect is not a guarantee: the moment anything is
  # created at the old name the redirect stops and every installed client
  # silently checks a repository we do not own. This value is baked into
  # `app-update.yml` inside each build, so it is the one that decides where
  # installed copies look for their updates.
  owner: seth-torrence
  repo: artemis

npmRebuild: false
